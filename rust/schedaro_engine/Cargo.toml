[package]
name = "schedaro_engine"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Deterministic scheduling conflict validation for Schedaro"

[lib]
name = "schedaro_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py311"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
